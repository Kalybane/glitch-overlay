<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Overlay Media</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #media-container {
      position: fixed;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      background: #111;
      opacity: 0;
      transition: opacity 0.4s ease;
      width: 420px;
      bottom: 40px;
      right: 40px;
    }

    #media-container.visible {
      opacity: 1;
    }

    #media-wrapper {
      position: relative;
    }

    #media-container img,
    #media-container video {
      width: 100%;
      display: block;
      border-radius: 16px 16px 0 0;
    }

    #author-banner {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px 6px 6px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
    }

    #author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
    }

    #author-name {
      color: white;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    #caption {
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.4;
      display: none;
      border-radius: 0 0 16px 16px;
    }

    #caption.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div id="media-container">
    <div id="media-wrapper">
      <div id="media-slot"></div>
      <div id="author-banner">
        <img id="author-avatar" src="" alt="avatar" />
        <span id="author-name">Pseudo</span>
      </div>
    </div>
    <div id="caption"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const container = document.getElementById('media-container');
    const mediaSlot = document.getElementById('media-slot');
    const authorAvatar = document.getElementById('author-avatar');
    const authorName = document.getElementById('author-name');
    const caption = document.getElementById('caption');

    const WS_PASSWORD = 'GlitchOverlay2026!';

    let hideTimer = null;
    let overlayEnabled = true;
    let queue = [];
    let isPlaying = false;
    let currentDuration = 8000;
    let currentVolume = 1.0;

    const sizes = {
      small:  '220px',
      medium: '420px',
      large:  '640px'
    };

    const positions = {
      'top-left':      { top: '40px',    left: '40px',  bottom: null, right: null },
      'top-center':    { top: '40px',    left: '50%',   bottom: null, right: null, marginLeft: '-210px' },
      'top-right':     { top: '40px',    right: '40px', bottom: null, left: null  },
      'middle-left':   { top: '50%',     left: '40px',  bottom: null, right: null, marginTop: '-160px' },
      'center':        { top: '50%',     left: '50%',   bottom: null, right: null, marginTop: '-160px', marginLeft: '-210px' },
      'middle-right':  { top: '50%',     right: '40px', bottom: null, left: null,  marginTop: '-160px' },
      'bottom-left':   { bottom: '40px', left: '40px',  top: null,    right: null },
      'bottom-center': { bottom: '40px', left: '50%',   top: null,    right: null, marginLeft: '-210px' },
      'bottom-right':  { bottom: '40px', right: '40px', top: null,    left: null  },
    };

    function applySettings(settings) {
      overlayEnabled = settings.active;
      currentDuration = settings.duration * 1000;
      currentVolume = settings.volume / 100;
      container.style.width = sizes[settings.size];

      container.style.top        = 'auto';
      container.style.left       = 'auto';
      container.style.bottom     = 'auto';
      container.style.right      = 'auto';
      container.style.marginTop  = '0';
      container.style.marginLeft = '0';

      const pos = positions[settings.position];
      if (pos.top)        container.style.top        = pos.top;
      if (pos.left)       container.style.left       = pos.left;
      if (pos.bottom)     container.style.bottom     = pos.bottom;
      if (pos.right)      container.style.right      = pos.right;
      if (pos.marginTop)  container.style.marginTop  = pos.marginTop;
      if (pos.marginLeft) container.style.marginLeft = pos.marginLeft;

      const videos = mediaSlot.querySelectorAll('video');
      videos.forEach(v => v.volume = currentVolume);

      if (!settings.active) {
        hideMedia();
        queue = [];
      }
    }

    ipcRenderer.on('update-settings', (event, settings) => {
      applySettings(settings);
    });

    function showMedia(data) {
      if (!overlayEnabled) return;
      queue.push(data);
      if (!isPlaying) playNext();
    }

    function playNext() {
      if (queue.length === 0) {
        isPlaying = false;
        return;
      }

      isPlaying = true;
      const data = queue.shift();

      mediaSlot.innerHTML = '';
      if (hideTimer) clearTimeout(hideTimer);

      authorAvatar.src = data.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
      authorName.textContent = data.author || 'Inconnu';

      if (data.caption) {
        caption.textContent = data.caption;
        caption.classList.add('visible');
      } else {
        caption.textContent = '';
        caption.classList.remove('visible');
      }

      if (data.type === 'audio') {
        const audio = document.createElement('audio');
        audio.src = data.url;
        audio.autoplay = true;
        audio.volume = currentVolume;
        audio.loop = false;
        audio.onended = () => {
          hideMedia();
          setTimeout(playNext, 500);
        };

        mediaSlot.innerHTML = `
          <div style="
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 30px;
            background: linear-gradient(135deg, #1DB954, #191414);
            border-radius: 16px 16px 0 0;
            min-height: 120px;
          ">
            <div style="font-size: 48px;">🎵</div>
            <div style="color: white; font-size: 14px; margin-top: 10px; font-weight: bold;">
              ${data.author}
            </div>
          </div>
        `;
        mediaSlot.appendChild(audio);
        container.classList.add('visible');
        return;
      }

      let el;
      if (data.type === 'video') {
        el = document.createElement('video');
        el.src = data.url;
        el.autoplay = true;
        el.volume = currentVolume;
        el.controls = false;
        el.loop = false;
        el.onended = () => {
          hideMedia();
          setTimeout(playNext, 500);
        };
      } else {
        el = document.createElement('img');
        el.src = data.url;
        hideTimer = setTimeout(() => {
          hideMedia();
          setTimeout(playNext, 500);
        }, currentDuration);
      }

      mediaSlot.appendChild(el);
      container.classList.add('visible');
    }

    function hideMedia() {
      container.classList.remove('visible');

      const videos = mediaSlot.querySelectorAll('video');
      videos.forEach(v => {
        v.pause();
        v.src = '';
      });

      const audios = mediaSlot.querySelectorAll('audio');
      audios.forEach(a => {
        a.pause();
        a.src = '';
      });

      mediaSlot.innerHTML = '';
    }

    function connect() {
      const ws = new WebSocket('wss://glitch-overlay-production.up.railway.app');

      ws.onopen = () => {
        ws.send(WS_PASSWORD);
        console.log('WS connecté');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'skip') {
          hideMedia();
          setTimeout(playNext, 500);
          return;
        }

        if (data.type === 'clear') {
          queue = [];
          hideMedia();
          isPlaying = false;
          return;
        }

        if (data.type === 'pause') {
          overlayEnabled = false;
          hideMedia();
          return;
        }

        if (data.type === 'resume') {
          overlayEnabled = true;
          if (queue.length > 0) playNext();
          return;
        }

        showMedia(data);
      };

      ws.onclose = () => {
        console.log('WS fermé, reconnexion dans 3s...');
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
