<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Overlay Media</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #media-container {
      position: fixed;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      background: #111;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      width: 420px;
      bottom: 40px;
      right: 40px;
    }

    #media-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #media-wrapper {
      position: relative;
    }

    #media-container img,
    #media-container video {
      width: 100%;
      display: block;
      border-radius: 16px;
    }

    #author-banner {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px 6px 6px;
      border-radius: 30px;
      backdrop-filter: blur(4px);
    }

    #author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
    }

    #author-name {
      color: white;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div id="media-container">
    <div id="media-wrapper">
      <div id="media-slot"></div>
      <div id="author-banner">
        <img id="author-avatar" src="" alt="avatar" />
        <span id="author-name">Pseudo</span>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const container = document.getElementById('media-container');
    const mediaSlot = document.getElementById('media-slot');
    const authorAvatar = document.getElementById('author-avatar');
    const authorName = document.getElementById('author-name');

    const WS_PASSWORD = 'GlitchOverlay2026!';

    let hideTimer = null;
    let overlayEnabled = true;
    let queue = [];
    let isPlaying = false;
    let currentDuration = 8000;
    let currentVolume = 1.0;

    const sizes = {
      small:  '220px',
      medium: '420px',
      large:  '640px'
    };

    const positions = {
      'top-left':      { top: '40px',  left: '40px',        bottom: 'auto', right: 'auto',  transform: 'none' },
      'top-center':    { top: '40px',  left: '50%',         bottom: 'auto', right: 'auto',  transform: 'translateX(-50%)' },
      'top-right':     { top: '40px',  right: '40px',       bottom: 'auto', left: 'auto',   transform: 'none' },
      'middle-left':   { top: '50%',   left: '40px',        bottom: 'auto', right: 'auto',  transform: 'translateY(-50%)' },
      'center':        { top: '50%',   left: '50%',         bottom: 'auto', right: 'auto',  transform: 'translate(-50%, -50%)' },
      'middle-right':  { top: '50%',   right: '40px',       bottom: 'auto', left: 'auto',   transform: 'translateY(-50%)' },
      'bottom-left':   { bottom: '40px', left: '40px',      top: 'auto',    right: 'auto',  transform: 'none' },
      'bottom-center': { bottom: '40px', left: '50%',       top: 'auto',    right: 'auto',  transform: 'translateX(-50%)' },
      'bottom-right':  { bottom: '40px', right: '40px',     top: 'auto',    left: 'auto',   transform: 'none' },
    };

    function applySettings(settings) {
      overlayEnabled = settings.active;
      currentDuration = settings.duration * 1000;
      currentVolume = settings.volume / 100;
      container.style.width = sizes[settings.size];

      const pos = positions[settings.position];
      container.style.top       = pos.top       || 'auto';
      container.style.left      = pos.left      || 'auto';
      container.style.bottom    = pos.bottom    || 'auto';
      container.style.right     = pos.right     || 'auto';
      container.style.transform = pos.transform || 'none';

      // Applique le volume aux vidéos en cours
      const videos = mediaSlot.querySelectorAll('video');
      videos.forEach(v => v.volume = currentVolume);

      if (!settings.active) {
        hideMedia();
        queue = [];
      }
    }

    ipcRenderer.on('update-settings', (event, settings) => {
      applySettings(settings);
    });

    function showMedia(data) {
      if (!overlayEnabled) return;
      queue.push(data);
      if (!isPlaying) playNext();
    }

    function playNext() {
      if (queue.length === 0) {
        isPlaying = false;
        return;
      }

      isPlaying = true;
      const data = queue.shift();

      mediaSlot.innerHTML = '';
      if (hideTimer) clearTimeout(hideTimer);

      authorAvatar.src = data.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';
      authorName.textContent = data.author || 'Inconnu';

      let el;
      if (data.type === 'video') {
        el = document.createElement('video');
        el.src = data.url;
        el.autoplay = true;
        el.volume = currentVolume;
        el.controls = false;
        el.loop = false;
        el.onended = () => {
          hideMedia();
          setTimeout(playNext, 500);
        };
      } else {
        el = document.createElement('img');
        el.src = data.url;
        hideTimer = setTimeout(() => {
          hideMedia();
          setTimeout(playNext, 500);
        }, currentDuration);
      }

      mediaSlot.appendChild(el);
      container.classList.add('visible');
    }

    function hideMedia() {
      container.classList.remove('visible');
    }

    function connect() {
      const ws = new WebSocket('wss://glitch-overlay-production.up.railway.app');

      ws.onopen = () => {
        ws.send(WS_PASSWORD);
        console.log('WS connecté');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'skip') {
          hideMedia();
          setTimeout(playNext, 500);
          return;
        }

        if (data.type === 'clear') {
          queue = [];
          hideMedia();
          isPlaying = false;
          return;
        }

        if (data.type === 'pause') {
          overlayEnabled = false;
          hideMedia();
          return;
        }

        if (data.type === 'resume') {
          overlayEnabled = true;
          if (queue.length > 0) playNext();
          return;
        }

        showMedia(data);
      };

      ws.onclose = () => {
        console.log('WS fermé, reconnexion dans 3s...');
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
