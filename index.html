<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Overlay Media</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    #media-container {
      position: fixed;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: none;
      background: transparent;
      opacity: 0;
      transition: opacity 0.4s ease;
      width: 420px;
      bottom: 40px;
      right: 40px;
    }

    #media-container.visible {
      opacity: 1;
    }

    #media-wrapper {
      position: relative;
    }

    #media-container img,
    #media-container video {
      width: 100%;
      display: block;
      border-radius: 16px;
    }

    #author-banner {
      position: absolute;
      top: 8px;
      left: 8px;
      background: transparent;
      padding: 2px;
      border-radius: 50%;
    }

    #author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #23d160;
      object-fit: cover;
      box-shadow: 0 0 5px rgba(35,209,96,0.3);
      display: block;
    }

    #author-name {
      display: none;
    }

 #caption {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  text-align: center;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 28px;
  font-weight: bold;
  color: white;
  letter-spacing: 0px;
  background: transparent;
  padding: 0 14px;
  text-shadow:
    2px 2px 0 black,
    -2px -2px 0 black,
    2px -2px 0 black,
    -2px 2px 0 black,
    0px 2px 0 black,
    0px -2px 0 black,
    2px 0px 0 black,
    -2px 0px 0 black;
  display: none;
  -webkit-font-smoothing: antialiased;
}

    #caption.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div id="media-container">
    <div id="media-wrapper">
      <div id="media-slot"></div>
      <div id="author-banner">
        <img id="author-avatar" src="" alt="avatar" />
        <span id="author-name"></span>
      </div>
      <div id="caption"></div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const container = document.getElementById('media-container');
    const mediaSlot = document.getElementById('media-slot');
    const authorAvatar = document.getElementById('author-avatar');
    const authorName = document.getElementById('author-name');
    const caption = document.getElementById('caption');

    const WS_PASSWORD = 'GlitchOverlay2026!';

    let hideTimer = null;
    let overlayEnabled = true;
    let queue = [];
    let isPlaying = false;
    let currentDuration = 8000;
    let currentVolume = 1.0;

    function applySettings(settings) {
      overlayEnabled = settings.active;
      currentDuration = settings.duration * 1000;
      currentVolume = settings.volume / 100;

      const w = settings.size === 'small' ? 220 : settings.size === 'large' ? 640 : settings.size === 'enormous' ? 840 : 420;
      container.style.width = w + 'px';

      const fontSize = settings.size === 'small' ? 16 : settings.size === 'large' ? 36 : settings.size === 'enormous' ? 48 : 28;
      caption.style.fontSize = fontSize + 'px';

      container.style.top    = 'auto';
      container.style.left   = 'auto';
      container.style.bottom = 'auto';
      container.style.right  = 'auto';

      if (settings.position && settings.position.x !== null) {
        container.style.left = settings.position.x + 'px';
        container.style.top  = settings.position.y + 'px';
      } else {
        container.style.bottom = '40px';
        container.style.right  = '40px';
      }

      const videos = mediaSlot.querySelectorAll('video');
      videos.forEach(v => v.volume = currentVolume);

      if (!settings.active) {
        hideMedia();
        queue = [];
      }
    }

    ipcRenderer.on('update-settings', (event, settings) => {
      applySettings(settings);
    });

    function showMedia(data) {
      if (!overlayEnabled) return;
      queue.push(data);
      if (!isPlaying) playNext();
    }

    function playNext() {
      if (queue.length === 0) {
        isPlaying = false;
        return;
      }

      isPlaying = true;
      const data = queue.shift();

      mediaSlot.innerHTML = '';
      if (hideTimer) clearTimeout(hideTimer);

      authorAvatar.src = data.avatar || 'https://cdn.discordapp.com/embed/avatars/0.png';

      if (data.caption) {
        caption.textContent = data.caption;
        caption.classList.add('visible');
      } else {
        caption.textContent = '';
        caption.classList.remove('visible');
      }

      if (data.type === 'audio') {
        const audio = document.createElement('audio');
        audio.src = data.url;
        audio.autoplay = true;
        audio.volume = currentVolume;
        audio.loop = false;
        audio.onended = () => {
          hideMedia();
          setTimeout(playNext, 500);
        };
        document.body.appendChild(audio);
        isPlaying = true;
        return;
      }

      if (data.type === 'video') {
        const el = document.createElement('video');
        el.src = data.url;
        el.autoplay = true;
        el.volume = currentVolume;
        el.controls = false;
        el.loop = false;
        el.oncanplay = () => {
          mediaSlot.appendChild(el);
          container.classList.add('visible');
        };
        el.onended = () => {
          hideMedia();
          setTimeout(playNext, 500);
        };
      } else {
        const el = document.createElement('img');
        el.src = data.url;
        el.onload = () => {
          mediaSlot.appendChild(el);
          container.classList.add('visible');
          hideTimer = setTimeout(() => {
            hideMedia();
            setTimeout(playNext, 500);
          }, currentDuration);
        };
      }
    }

    function hideMedia() {
      container.classList.remove('visible');

      const videos = mediaSlot.querySelectorAll('video');
      videos.forEach(v => {
        v.pause();
        v.src = '';
      });

      const audios = document.querySelectorAll('audio');
      audios.forEach(a => {
        a.pause();
        a.src = '';
        a.remove();
      });

      mediaSlot.innerHTML = '';
    }

    function connect() {
      const ws = new WebSocket('wss://glitch-overlay-production.up.railway.app');

      ws.onopen = () => {
        ws.send(WS_PASSWORD);
        console.log('WS connecté');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'skip') {
          hideMedia();
          setTimeout(playNext, 500);
          return;
        }

        if (data.type === 'clear') {
          queue = [];
          hideMedia();
          isPlaying = false;
          return;
        }

        if (data.type === 'pause') {
          overlayEnabled = false;
          hideMedia();
          return;
        }

        if (data.type === 'resume') {
          overlayEnabled = true;
          if (queue.length > 0) playNext();
          return;
        }

        showMedia(data);
      };

      ws.onclose = () => {
        console.log('WS fermé, reconnexion dans 3s...');
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
